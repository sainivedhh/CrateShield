sonar.projectKey=CrateShield
sonar.projectName=CrateShield
sonar.projectVersion=0.1.0
sonar.organization=sainivedhh

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language
sonar.language=py
sonar.python.version=3.11

# Coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**,.venv/**
sonar.coverage.exclusions=tests/**
