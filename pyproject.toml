[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crateshield"
version = "0.1.0"
description = "LLM-assisted detection of malicious Rust crates"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crateshield = "crateshield.__main__:main"

[tool.ruff]
# Keep CI focused on correctness while the legacy modules are incrementally
# modernized. These rules are stylistic or advisory and currently produce
# noisy failures across the existing codebase.
required-version = ">=0.9.0"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad exception handling is intentional at network boundaries
    "F401",    # some imports are retained for optional/runtime integrations
    "FURB167",
    "FURB188",
    "I001",    # import formatting is handled during the modernization pass
    "PLR0402",
    "PLW1510",
    "RUF059",
    "S110",
    "SIM102",
    "TRY201",
    "UP017",
    "UP045",
]
