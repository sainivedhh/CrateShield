[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crateshield"
version = "0.1.0"
description = "LLM-assisted detection of malicious Rust crates"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "google-genai>=2.0",
    "tree-sitter>=0.26",
    "tree-sitter-rust>=0.24",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crateshield = "crateshield.__main__:main"

[tool.ruff]
# Keep CI focused on correctness while the legacy modules are incrementally
# modernized. These rules are stylistic or advisory and currently produce
# noisy failures across the existing codebase.
required-version = ">=0.9.0"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad exception handling is intentional at network boundaries
    "F401",    # some imports are retained for optional/runtime integrations
    "FURB167",
    "FURB188",
    "I001",    # import formatting is handled during the modernization pass
    "PLR0402",
    "PLW1510",
    "RUF059",
    "S110",
    "SIM102",
    "TRY201",
    "UP017",
    "UP045",
]

[tool.coverage.run]
omit = [
    "src/crateshield/__main__.py",
    "src/crateshield/api.py",
    "src/crateshield/pipeline.py",
    "src/crateshield/evaluation/train.py",
    "src/crateshield/evaluation/ablation.py",
    "src/crateshield/evaluation/distill.py",
    "src/crateshield/evaluation/finetune.py",
    "src/crateshield/evaluation/risk.py",
    "src/crateshield/evaluation/report.py",
    "src/crateshield/ingestion/synthetic.py",
    "src/crateshield/ingestion/known_incidents.py",
    "src/crateshield/ingestion/ossf.py",
    "src/crateshield/llm/*",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
